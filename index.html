<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FFF7E6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Amentora" />
    <meta name="description" content="Amentora — área de membros, mentorias ao vivo e ferramentas para criar conteúdo que viraliza." />
    <link rel="apple-touch-icon" href="/logo-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Amentora</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- ═══════════════════════════════════════════════════════════════
         GUARDA DE BOOT — última linha de defesa contra a tela branca.

         O ErrorBoundary do React não cobre o pior caso: quando o próprio
         bundle principal não carrega (arquivo de um deploy antigo), o React
         nunca inicia, então não existe boundary nenhum pra socorrer. Este
         script roda antes de tudo e cobre justamente esse buraco.

         Duas travas:
         1. <script>/<link> de /assets/ que falhar → limpa e recarrega.
         2. Se depois de 12s o #root continuar vazio → limpa e recarrega.
            Se já tentou uma vez nesta sessão, mostra uma mensagem em vez de
            entrar em loop de reload.
         ═══════════════════════════════════════════════════════════════ -->
    <script>
      (function () {
        var KEY = 'dam_stale_build_recovery'; // mesma chave do src/lib/appRecovery.ts
        var done = false;

        function alreadyTried() {
          try { return sessionStorage.getItem(KEY) === '1'; } catch (e) { return false; }
        }

        function recover() {
          if (done) return;
          done = true;
          try { sessionStorage.setItem(KEY, '1'); } catch (e) {}

          var jobs = [];
          try {
            if ('serviceWorker' in navigator) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister()['catch'](function () {}); }));
              })['catch'](function () {}));
            }
          } catch (e) {}
          try {
            if (window.caches) {
              jobs.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches['delete'](k)['catch'](function () {}); }));
              })['catch'](function () {}));
            }
          } catch (e) {}

          Promise.all(jobs)['catch'](function () {}).then(function () {
            window.location.reload();
          });
        }

        function showFallback() {
          var root = document.getElementById('root');
          if (!root || root.innerHTML !== '') return;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;' +
            'justify-content:center;gap:18px;padding:0 32px;text-align:center;' +
            "font-family:'Be Vietnam Pro',-apple-system,BlinkMacSystemFont,sans-serif\">" +
            '<h1 style="font-family:\'Libre Caslon Text\',Georgia,serif;font-size:22px;color:#1E1B11;margin:0">' +
            'Não conseguimos carregar o app</h1>' +
            '<p style="font-size:14px;line-height:1.6;color:#5B4041;max-width:280px;margin:0">' +
            'Verifique sua internet e toque no botão abaixo.</p>' +
            '<button id="dam-retry" style="border:0;padding:13px 28px;border-radius:999px;color:#fff;' +
            'font-size:14px;font-weight:700;background:linear-gradient(180deg,#E63462 0%,#CB1B49 100%)">' +
            'Tentar de novo</button></div>';
          var btn = document.getElementById('dam-retry');
          if (btn) btn.onclick = function () { done = false; recover(); };
        }

        // 1. Falha de carregamento de um arquivo do app.
        window.addEventListener('error', function (e) {
          var el = e.target;
          if (!el || !el.tagName) return;
          var url = el.src || el.href || '';
          if (url.indexOf('/assets/') === -1) return;
          if (alreadyTried()) { showFallback(); return; }
          recover();
        }, true);

        // 2. Vigia: tela ainda vazia depois de 12s = algo travou.
        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.innerHTML !== '') return; // app subiu, tudo certo
          if (alreadyTried()) { showFallback(); return; }
          recover();
        }, 12000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
